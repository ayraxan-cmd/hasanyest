<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flags Battle Royale - Premium Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle, #0b192c 0%, #030712 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        /* Top Header Box (Group Scoreboard) */
        .top-header {
            background: linear-gradient(135deg, #0f2b46 0%, #091726 100%);
            border: 2px solid #1e3a8a;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 15px;
            padding: 10px;
            box-shadow: 0 4px 20px rgba(0, 149, 255, 0.2);
        }
        .header-title {
            color: #38bdf8;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .groups-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .group-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e3a8a;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .group-name {
            color: #cbd5e1;
            font-weight: 600;
        }
        .group-score {
            color: #facc15;
            font-weight: bold;
        }

        /* Main Arena Container */
        .arena-container {
            position: relative;
            width: 330px;
            height: 330px;
            margin-top: 10px;
            animation: rotateArena 25s linear infinite;
        }

        @keyframes rotateArena {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* The Circle Arena */
        .arena {
            width: 100%;
            height: 100%;
            border: 6px solid #1e3a8a;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #0f172a 0%, #020617 85%);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.25), inset 0 0 20px rgba(0,0,0,0.8);
            overflow: visible;
        }

        /* Premium Gap (গেট বা ফাঁক) */
        .gap {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background-color: #030712;
            z-index: 5;
            border-bottom: 3px solid #ef4444;
            border-radius: 5px;
            box-shadow: 0 0 10px #ef4444;
        }

        /* Flag Item */
        .flag-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 38px;
            transition: transform 0.2s ease;
            will-change: left, top;
        }
        .flag-emoji {
            font-size: 22px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .flag-name {
            font-size: 8px;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.85);
            padding: 1px 4px;
            border-radius: 4px;
            white-space: nowrap;
            margin-top: 2px;
            font-weight: bold;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Winner Announcement Overlay Inside Arena */
        .winner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(3, 7, 18, 0.92);
            border: 2px solid #facc15;
            border-radius: 12px;
            padding: 15px 25px;
            z-index: 100;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
            animation: popUp 0.5s ease-out;
        }
        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .winner-overlay .w-emoji {
            font-size: 45px;
        }
        .winner-overlay .w-text {
            color: #facc15;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .winner-overlay .w-name {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- Top Header Box (4 Groups & Wins) -->
    <div class="top-header">
        <div class="header-title" id="headerTitle">🏁 BATTLE ROYALE 🏁</div>
        <div class="groups-grid" id="groupsGrid">
            <!-- ডাইনামিক গ্রুপ স্কোর এখানে আসবে -->
        </div>
    </div>

    <!-- Arena Container -->
    <div class="arena-container">
        <div class="arena" id="arena">
            <div class="gap"></div>
        </div>
    </div>

    <script>
        // ৪টি দলে বিভক্ত করে দেশের তালিকা
        const groupsData = [
            { name: "Group A", flags: [{ name: "Bangladesh", emoji: "🇧🇩" }, { name: "India", emoji: "🇮🇳" }, { name: "Pakistan", emoji: "🇵🇰" }, { name: "Sri Lanka", emoji: "🇱🇰" }] },
            { name: "Group B", flags: [{ name: "Brazil", emoji: "🇧🇷" }, { name: "Argentina", emoji: "🇦🇷" }, { name: "France", emoji: "🇫🇷" }, { name: "Germany", emoji: "🇩🇪" }] },
            { name: "Group C", flags: [{ name: "USA", emoji: "🇺🇸" }, { name: "UK", emoji: "🇬🇧" }, { name: "Canada", emoji: "🇨🇦" }, { name: "Japan", emoji: "🇯🇵" }] },
            { name: "Group D", flags: [{ name: "Saudi Arabia", emoji: "🇸🇦" }, { name: "Turkey", emoji: "🇹🇷" }, { name: "Italy", emoji: "🇮🇹" }, { name: "Spain", emoji: "🇪🇸" }] }
        ];

        let groupWins = { "Group A": 0, "Group B": 0, "Group C": 0, "Group D": 0 };

        const arena = document.getElementById('arena');
        const groupsGrid = document.getElementById('groupsGrid');
        const headerTitle = document.getElementById('headerTitle');

        const ARENA_SIZE = 330;
        const RADIUS = ARENA_SIZE / 2;

        let activeFlags = [];
        let physicsInterval;
        let matchTimer;
        let isMatchOver = false;

        function updateGroupUI() {
            groupsGrid.innerHTML = '';
            groupsData.forEach(g => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.innerHTML = `<span class="group-name">${g.name}</span> <span class="group-score">${groupWins[g.name]} Wins</span>`;
                groupsGrid.appendChild(card);
            });
        }

        function initGame() {
            // পুরানো ওভারলে বা এলিমেন্ট পরিষ্কার করা
            const oldOverlay = arena.querySelector('.winner-overlay');
            if (oldOverlay) oldOverlay.remove();

            arena.innerHTML = '<div class="gap"></div>';
            activeFlags = [];
            isMatchOver = false;
            headerTitle.innerText = "🏁 TOURNAMENT BATTLE RUNNING 🏁";

            // সব দল থেকে পতাকা নিয়ে মোট ১৬টি পতাকা প্রস্তুত করা
            let allMatchFlags = [];
            groupsData.forEach(g => {
                g.flags.forEach(f => {
                    allMatchFlags.push({ ...f, group: g.name });
                });
            });

            // রেন্ডম শাফেল
            allMatchFlags.sort(() => 0.5 - Math.random());

            allMatchFlags.forEach((data) => {
                const el = document.createElement('div');
                el.className = 'flag-item';
                el.innerHTML = `<span class="flag-emoji">${data.emoji}</span><span class="flag-name">${data.name}</span>`;
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (RADIUS - 60);
                const x = RADIUS - 21 + (dist * Math.cos(angle));
                const y = RADIUS - 19 + (dist * Math.sin(angle));

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                arena.appendChild(el);

                activeFlags.push({
                    element: el,
                    name: data.name,
                    emoji: data.emoji,
                    group: data.group,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    isExiting: false
                });
            });

            updateGroupUI();

            clearInterval(physicsInterval);
            clearTimeout(matchTimer);

            physicsInterval = setInterval(updatePhysics, 1000 / 60);

            // ৫০ সেকেন্ডের মধ্যে ম্যাচ উইন হওয়ার ফিক্সড টাইম লজিক (টাইমার হাইড থাকবে)
            matchTimer = setTimeout(() => {
                if (!isMatchOver && activeFlags.length > 0) {
                    // শেষ পর্যন্ত যে বা যারা থাকে তার মধ্য থেকে রেন্ডম একজনকে উইনার ঘোষণা করা
                    let survivor = activeFlags[Math.floor(Math.random() * activeFlags.length)];
                    declareWinner(survivor);
                }
            }, 50000);
        }

        function updatePhysics() {
            if (isMatchOver) return;

            // যদি মাঠে মাত্র ১টি পতাকা বেঁচে থাকে
            if (activeFlags.length === 1 && !activeFlags[0].isExiting) {
                clearTimeout(matchTimer);
                declareWinner(activeFlags[0]);
                return;
            }

            for (let i = activeFlags.length - 1; i >= 0; i--) {
                let flag = activeFlags[i];

                if (flag.isExiting) {
                    flag.vy += 0.6;
                    flag.y += flag.vy;
                    flag.element.style.top = `${flag.y}px`;

                    if (flag.y > ARENA_SIZE + 50) {
                        flag.element.remove();
                        activeFlags.splice(i, 1);
                    }
                    continue;
                }

                // প্রিমিয়াম র‍্যান্ডম মুভমেন্ট
                flag.vx += (Math.random() - 0.5) * 0.8;
                flag.vy += (Math.random() - 0.5) * 0.8;

                flag.x += flag.vx;
                flag.y += flag.vy;

                const dx = flag.x + 21 - RADIUS;
                const dy = flag.y + 19 - RADIUS;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // বৃত্তের বাউন্ডারি এবং নিচের ফাঁক দিয়ে প্রিমিয়াম এক্সিট অ্যানিমেশন
                if (dist + 19 >= RADIUS - 5) {
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // নিচের গেট বা গ্যাপ দিয়ে বের হওয়ার নিখুঁত শর্ত (পতাকা বেশি থাকলে দ্রুত কমানো)
                    if (Math.abs(dx) < 25 && dy > RADIUS - 45 && activeFlags.length > 1) {
                        flag.isExiting = true;
                        flag.vx = 0;
                        flag.vy = 6;
                        // প্রিমিয়াম ইফেক্টের জন্য ফেইড আউট বা স্কেল করা
                        flag.element.style.transition = "transform 0.3s ease";
                        flag.element.style.transform = "scale(0.5)";
                        continue;
                    }

                    const dot = flag.vx * nx + flag.vy * ny;
                    flag.vx = (flag.vx - 2 * dot * nx) * 0.82;
                    flag.vy = (flag.vy - 2 * dot * ny) * 0.82;

                    const overlap = (dist + 19) - (RADIUS - 4);
                    flag.x -= nx * overlap;
                    flag.y -= ny * overlap;
                }

                flag.element.style.left = `${flag.x}px`;
                flag.element.style.top = `${flag.y}px`;
            }
        }

        function declareWinner(winner) {
            if (isMatchOver) return;
            isMatchOver = true;
            clearInterval(physicsInterval);
            clearTimeout(matchTimer);

            // বিজয়ী দলের পয়েন্ট ১ বাড়িয়ে দেওয়া
            groupWins[winner.group]++;
            updateGroupUI();

            headerTitle.innerText = `🏆 ${winner.group} WON THE MATCH! 🏆`;

            // বৃত্তের ভেতরে থাকা বাকি সব পতাকা রিমুভ করা
            activeFlags.forEach(f => {
                if(f !== winner) f.element.remove();
            });
            activeFlags = [winner];

            // বিজয়ী পতাকাকে বৃত্তের ঠিক মাঝে এনে বড় করে প্রিমিয়াম উইনার লুক দেওয়া
            winner.element.style.transition = "all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            winner.element.style.left = `${RADIUS - 21}px`;
            winner.element.style.top = `${RADIUS - 19}px`;
            winner.element.style.transform = "scale(1.8)";
            winner.element.style.zIndex = "50";

            // বৃত্তের ভেতরে মাঝখানে প্রিমিয়াম উইনার ওভারলে পপআপ
            const overlay = document.createElement('div');
            overlay.className = 'winner-overlay';
            overlay.innerHTML = `
                <div class="w-emoji">${winner.emoji}</div>
                <div class="w-text">${winner.group} Winner</div>
                <div class="w-name">${winner.name}</div>
            `;
            arena.appendChild(overlay);

            // ৪ সেকেন্ড পর স্বয়ংক্রিয়ভাবে নতুন ম্যাচ শুরু হবে (অটো-প্লে লুপ)
            setTimeout(initGame, 4500);
        }

        // গেম শুরু
        initGame();
    </script>
</body>
</html>
