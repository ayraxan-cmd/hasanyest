<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flags Battle Royale - Mobile Friendly</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050b15;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        /* Top Header Box (Screen-shot Style) */
        .top-header {
            background: #0a1930;
            border: 2px solid #1a3a6b;
            border-radius: 8px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 10px;
            padding: 8px;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }
        .header-title {
            color: #00d2ff;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .qualify-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .qualify-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #112240;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            border-left: 3px solid #00d2ff;
        }
        .qualify-row span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Arena Container */
        .arena-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin-top: 15px;
        }

        /* Timer */
        #timer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #ff4757;
            background: rgba(5, 11, 21, 0.9);
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid #ff4757;
            z-index: 10;
        }

        /* The Circle Arena */
        .arena {
            width: 100%;
            height: 100%;
            border: 5px solid #1a3a6b;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #0a1930 0%, #050b15 80%);
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.2);
            overflow: hidden; /* ভেতরের পতাকা বাইরে যেতে বাধা দেবে না যদি পজিশন নিখুঁত থাকে */
        }

        /* The Gap (ফাঁক) */
        .gap {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 8px;
            background-color: #050b15;
            z-index: 5;
            border-radius: 4px;
            box-shadow: inset 0 0 5px #00d2ff;
        }

        /* Flag Elements */
        .flag-item {
            position: absolute;
            width: 26px;
            height: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Top Header Box -->
    <div class="top-header">
        <div class="header-title" id="headerTitle">🏁 QUALIFYING (5 QUALIFIED) 🏁</div>
        <div class="qualify-list" id="qualifyList">
            <!-- ডাইনামিকালি রো এখানে আসবে -->
        </div>
    </div>

    <!-- Arena Container -->
    <div class="arena-container">
        <div id="timer">55</div>
        <div class="arena" id="arena">
            <div class="gap"></div>
        </div>
    </div>

    <script>
        const flagsData = [
            { name: "Afghanistan", emoji: "🇦🇫" }, { name: "Albania", emoji: "🇦🇱" }, { name: "Algeria", emoji: "🇩🇿" },
            { name: "Argentina", emoji: "🇦🇷" }, { name: "Australia", emoji: "🇦🇺" }, { name: "Austria", emoji: "🇦🇹" },
            { name: "Bangladesh", emoji: "🇧🇩" }, { name: "Belgium", emoji: "🇧🇪" }, { name: "Brazil", emoji: "🇧🇷" },
            { name: "Canada", emoji: "🇨🇦" }, { name: "China", emoji: "🇨🇳" }, { name: "Colombia", emoji: "🇨🇴" },
            { name: "Denmark", emoji: "🇩🇰" }, { name: "Egypt", emoji: "🇪🇬" }, { name: "France", emoji: "🇫🇷" },
            { name: "Germany", emoji: "🇩🇪" }, { name: "Greece", emoji: "🇬🇷" }, { name: "India", emoji: "🇮🇳" },
            { name: "Indonesia", emoji: "🇮🇩" }, { name: "Italy", emoji: "🇮🇹" }, { name: "Japan", emoji: "🇯🇵" },
            { name: "Malaysia", emoji: "🇲🇾" }, { name: "Mexico", emoji: "🇲🇽" }, { name: "Morocco", emoji: "🇲🇦" },
            { name: "Netherlands", emoji: "🇳🇱" }, { name: "New Zealand", emoji: "🇳🇿" }, { name: "Nigeria", emoji: "🇳🇬" },
            { name: "Norway", emoji: "🇳🇴" }, { name: "Pakistan", emoji: "🇵🇰" }, { name: "Philippines", emoji: "🇵🇭" },
            { name: "Poland", emoji: "🇵🇱" }, { name: "Portugal", emoji: "🇵🇹" }, { name: "Russia", emoji: "🇷🇺" },
            { name: "Saudi Arabia", emoji: "🇸🇦" }, { name: "South Africa", emoji: "🇿🇦" }, { name: "South Korea", emoji: "🇰🇷" },
            { name: "Spain", emoji: "🇪🇸" }, { name: "Sweden", emoji: "🇸🇪" }, { name: "Switzerland", emoji: "🇨🇭" },
            { name: "Turkey", emoji: "🇹🇷" }, { name: "Ukraine", emoji: "🇺🇦" }, { name: "UK", emoji: "🇬🇧" },
            { name: "USA", emoji: "🇺🇸" }, { name: "Vietnam", emoji: "🇻🇳" }
        ];

        const arena = document.getElementById('arena');
        const timerEl = document.getElementById('timer');
        const qualifyListEl = document.getElementById('qualifyList');
        const headerTitle = document.getElementById('headerTitle');

        const ARENA_SIZE = 340;
        const RADIUS = ARENA_SIZE / 2;
        const GAP_WIDTH = 45;
        const FLAG_SIZE = 26;

        let activeFlags = [];
        let qualifiedFlags = [];
        let timeLeft = 55;
        let gameInterval;
        let physicsInterval;
        let isMatchOver = false;

        function initGame() {
            arena.innerHTML = '<div class="gap"></div>';
            activeFlags = [];
            qualifiedFlags = [];
            timeLeft = 55;
            isMatchOver = false;
            timerEl.innerText = timeLeft;
            timerEl.style.color = "#ff4757";
            headerTitle.innerText = "🏁 QUALIFYING (5 QUALIFIED) 🏁";

            // র‍্যান্ডমলি ৩০টি পতাকা সিলেক্ট করা
            const shuffled = [...flagsData].sort(() => 0.5 - Math.random());
            const selectedFlags = shuffled.slice(0, 30);

            selectedFlags.forEach((data) => {
                const el = document.createElement('div');
                el.className = 'flag-item';
                el.innerText = data.emoji;
                
                // বৃত্তের ভেতরে পজিশন সেট করা
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (RADIUS - 40);
                const x = RADIUS - (FLAG_SIZE/2) + (dist * Math.cos(angle));
                const y = RADIUS - (FLAG_SIZE/2) + (dist * Math.sin(angle));

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                arena.appendChild(el);

                activeFlags.push({
                    element: el,
                    name: data.name,
                    emoji: data.emoji,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    isExiting: false
                });
            });

            updateQualifyUI();

            clearInterval(gameInterval);
            clearInterval(physicsInterval);
            gameInterval = setInterval(runTimer, 1000);
            physicsInterval = setInterval(updatePhysics, 1000 / 60);
        }

        function runTimer() {
            if (isMatchOver) return;
            timeLeft--;
            timerEl.innerText = timeLeft;

            if (timeLeft <= 0) {
                // সময় শেষ হলে অটোমেটিক পরবর্তী রাউন্ডে চলে যাবে
                initGame();
            }
        }

        function updatePhysics() {
            if (isMatchOver) return;

            const damping = 0.99;
            const restitution = 0.8;

            for (let i = activeFlags.length - 1; i >= 0; i--) {
                let flag = activeFlags[i];

                if (flag.isExiting) {
                    flag.vy += 0.4;
                    flag.y += flag.vy;
                    flag.element.style.top = `${flag.y}px`;

                    if (flag.y > ARENA_SIZE + 30) {
                        flag.element.remove();
                        activeFlags.splice(i, 1);
                    }
                    continue;
                }

                flag.x += flag.vx;
                flag.y += flag.vy;

                // বৃত্তের কেন্দ্র থেকে দূরত্ব
                const dx = flag.x + (FLAG_SIZE/2) - RADIUS;
                const dy = flag.y + (FLAG_SIZE/2) - RADIUS;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // বাউন্ডারি চেক
                if (dist + (FLAG_SIZE/2) >= RADIUS - 2) {
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const dot = flag.vx * nx + flag.vy * ny;
                    flag.vx = (flag.vx - 2 * dot * nx) * restitution;
                    flag.vy = (flag.vy - 2 * dot * ny) * restitution;

                    const overlap = (dist + FLAG_SIZE/2) - (RADIUS - 2);
                    flag.x -= nx * overlap;
                    flag.y -= ny * overlap;

                    // গ্যাপ চেক (নিচের দিককার ফাঁক)
                    const angleToCenter = Math.atan2(dy, dx);
                    // নিচের অংশ (π/2 এর কাছাকাছি) এবং গ্যাপের উইথ বরাবর মিললে বের হয়ে যাবে
                    if (angleToCenter > (Math.PI / 2 - 0.4) && angleToCenter < (Math.PI / 2 + 0.4)) {
                        if (Math.abs(dx) < GAP_WIDTH / 2) {
                            if (qualifiedFlags.length < 5) {
                                flag.isExiting = true;
                                flag.vy = Math.abs(flag.vy) + 4;
                                flag.vx = (Math.random() - 0.5) * 2;

                                qualifyFlag(flag);
                            }
                        }
                    }
                }

                flag.vx *= damping;
                flag.vy *= damping;

                flag.element.style.left = `${flag.x}px`;
                flag.element.style.top = `${flag.y}px`;
            }
        }

        function qualifyFlag(flag) {
            if (!qualifiedFlags.some(f => f.name === flag.name)) {
                qualifiedFlags.push({ name: flag.name, emoji: flag.emoji });
                updateQualifyUI();

                // ৫ জন কোয়ালিফাই হয়ে গেলে ম্যাচ শেষ, ৩ সেকেন্ড পর অটো রিসেট
                if (qualifiedFlags.length === 5) {
                    isMatchOver = true;
                    headerTitle.innerText = "🏆 WINNERS QUALIFIED 🏆";
                    setTimeout(initGame, 3000);
                }
            }
        }

        function updateQualifyUI() {
            qualifyListEl.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                let f = qualifiedFlags[i];
                let row = document.createElement('div');
                row.className = 'qualify-row';
                if (f) {
                    row.innerHTML = `<span>#${i+1} ${f.emoji} ${f.name}</span> <span style="color:#00d2ff;">Qualified</span>`;
                } else {
                    row.innerHTML = `<span>#${i+1} ---</span> <span style="color:#555;">Waiting...</span>`;
                }
                qualifyListEl.appendChild(row);
            }
        }

        // গেম স্টার্ট
        initGame();
    </script>
</body>
</html>
