<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flags Battle Royale - Balanced Speed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle, #08121e 0%, #02060c 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        /* Top Header Box (Scoreboard) */
        .top-header {
            background: linear-gradient(135deg, #0d233a 0%, #071321 100%);
            border: 2px solid #1e3a8a;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 12px;
            padding: 10px;
            box-shadow: 0 4px 20px rgba(0, 149, 255, 0.25);
        }
        .header-title {
            color: #38bdf8;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .last-winner-banner {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid #facc15;
            border-radius: 6px;
            padding: 5px;
            font-size: 11px;
            color: #facc15;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .scores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .score-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1e3a8a;
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .country-info {
            color: #cbd5e1;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .win-count {
            color: #38bdf8;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Main Arena Container */
        .arena-container {
            position: relative;
            width: 330px;
            height: 330px;
            margin-top: 10px;
            transition: transform 0.5s ease;
        }
        .arena-container.rotating {
            animation: rotateArena 30s linear infinite;
        }
        @keyframes rotateArena {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* The Circle Arena */
        .arena {
            width: 100%;
            height: 100%;
            border: 6px solid #1e3a8a;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #0f172a 0%, #020617 85%);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3), inset 0 0 25px rgba(0,0,0,0.9);
            overflow: visible;
        }

        /* Gap (গেট) */
        .gap {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background-color: #02060c;
            z-index: 5;
            border-bottom: 3px solid #ef4444;
            border-radius: 5px;
            box-shadow: 0 0 10px #ef4444;
        }

        /* Flag Item */
        .flag-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 38px;
            will-change: left, top;
        }
        .flag-emoji {
            font-size: 22px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }
        .flag-name {
            font-size: 8px;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.9);
            padding: 1px 4px;
            border-radius: 4px;
            white-space: nowrap;
            margin-top: 2px;
            font-weight: bold;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Professional Winner Popup Overlay */
        .winner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(3, 7, 18, 0.96);
            border: 2px solid #facc15;
            border-radius: 14px;
            padding: 16px 26px;
            z-index: 100;
            box-shadow: 0 0 35px rgba(250, 204, 21, 0.6);
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .winner-overlay .w-emoji { font-size: 48px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .winner-overlay .w-text { color: #facc15; font-size: 13px; font-weight: bold; margin-top: 4px; text-transform: uppercase; letter-spacing: 1.5px; }
        .winner-overlay .w-name { color: #fff; font-size: 17px; font-weight: bold; margin-top: 2px; }
    </style>
</head>
<body>

    <!-- Top Header Box -->
    <div class="top-header">
        <div class="header-title">🏁 Top Winning Countries 🏁</div>
        <div class="last-winner-banner" id="lastWinnerBanner">Last Winner: None yet</div>
        <div class="scores-grid" id="scoresGrid"></div>
    </div>

    <!-- Arena Container -->
    <div class="arena-container rotating" id="arenaContainer">
        <div class="arena" id="arena">
            <div class="gap"></div>
        </div>
    </div>

    <script>
        const flagsData = [
            { name: "Bangladesh", emoji: "🇧🇩" }, { name: "India", emoji: "🇮🇳" }, { name: "Brazil", emoji: "🇧🇷" },
            { name: "Argentina", emoji: "🇦🇷" }, { name: "USA", emoji: "🇺🇸" }, { name: "UK", emoji: "🇬🇧" },
            { name: "France", emoji: "🇫🇷" }, { name: "Germany", emoji: "🇩🇪" }, { name: "Japan", emoji: "🇯🇵" },
            { name: "Canada", emoji: "🇨🇦" }, { name: "Pakistan", emoji: "🇵🇰" }, { name: "Saudi Arabia", emoji: "🇸🇦" },
            { name: "Turkey", emoji: "🇹🇷" }, { name: "Italy", emoji: "🇮🇹" }, { name: "Spain", emoji: "🇪🇸" }, { name: "Australia", emoji: "🇦🇺" }
        ];

        let countryWins = {};
        flagsData.forEach(f => countryWins[f.name] = 0);

        let lastWinnerName = "None yet";

        const arena = document.getElementById('arena');
        const arenaContainer = document.getElementById('arenaContainer');
        const scoresGrid = document.getElementById('scoresGrid');
        const lastWinnerBanner = document.getElementById('lastWinnerBanner');

        const ARENA_SIZE = 330;
        const RADIUS = ARENA_SIZE / 2;

        let activeFlags = [];
        let physicsInterval;
        let isMatchOver = false;

        function updateScoreboardUI() {
            lastWinnerBanner.innerText = `👑 Last Winner: ${lastWinnerName}`;
            
            let sortedCountries = Object.keys(countryWins).map(name => {
                let flagObj = flagsData.find(f => f.name === name);
                return { name, wins: countryWins[name], emoji: flagObj ? flagObj.emoji : "🏳️" };
            }).sort((a, b) => b.wins - a.wins);

            scoresGrid.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                let c = sortedCountries[i];
                const card = document.createElement('div');
                card.className = 'score-card';
                card.innerHTML = `
                    <span class="country-info">${c.emoji} ${c.name}</span>
                    <span class="win-count">${c.wins} Wins</span>
                `;
                scoresGrid.appendChild(card);
            }
        }

        function initGame() {
            const oldOverlay = arena.querySelector('.winner-overlay');
            if (oldOverlay) oldOverlay.remove();

            arena.innerHTML = '<div class="gap"></div>';
            activeFlags = [];
            isMatchOver = false;

            arenaContainer.classList.add('rotating');
            arenaContainer.style.transform = "rotate(0deg)";

            let shuffled = [...flagsData].sort(() => 0.5 - Math.random());
            let selectedFlags = shuffled.slice(0, 16);

            selectedFlags.forEach((data) => {
                const el = document.createElement('div');
                el.className = 'flag-item';
                el.innerHTML = `<span class="flag-emoji">${data.emoji}</span><span class="flag-name">${data.name}</span>`;
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (RADIUS - 60);
                const x = RADIUS - 21 + (dist * Math.cos(angle));
                const y = RADIUS - 19 + (dist * Math.sin(angle));

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                arena.appendChild(el);

                // স্পিড একটু কমিয়ে ৪.৮ করা হয়েছে, যাতে স্মুথ ও নিয়ন্ত্রিত লড়াই হয়
                activeFlags.push({
                    element: el,
                    name: data.name,
                    emoji: data.emoji,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4.8,
                    vy: (Math.random() - 0.5) * 4.8,
                    isExiting: false
                });
            });

            updateScoreboardUI();

            clearInterval(physicsInterval);
            physicsInterval = setInterval(updatePhysics, 1000 / 60);
        }

        function updatePhysics() {
            if (isMatchOver) return;

            if (activeFlags.length === 1 && !activeFlags[0].isExiting) {
                declareWinner(activeFlags[0]);
                return;
            }

            // পতাকাদের নিজেদের মধ্যকার ধাক্কাধাক্কি (মডারেট স্পিড)
            for (let i = 0; i < activeFlags.length; i++) {
                for (let j = i + 1; j < activeFlags.length; j++) {
                    let f1 = activeFlags[i];
                    let f2 = activeFlags[j];

                    let dx = f2.x - f1.x;
                    let dy = f2.y - f1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let minDist = 35;

                    if (dist < minDist && !f1.isExiting && !f2.isExiting) {
                        let nx = dx / dist;
                        let ny = dy / dist;
                        let overlap = minDist - dist;

                        f1.x -= nx * overlap * 0.5;
                        f1.y -= ny * overlap * 0.5;
                        f2.x += nx * overlap * 0.5;
                        f2.y += ny * overlap * 0.5;

                        let tempVx = f1.vx;
                        let tempVy = f1.vy;
                        f1.vx = f2.vx * 1.02;
                        f1.vy = f2.vy * 1.02;
                        f2.vx = tempVx * 1.02;
                        f2.vy = tempVy * 1.02;
                    }
                }
            }

            for (let i = activeFlags.length - 1; i >= 0; i--) {
                let flag = activeFlags[i];

                if (flag.isExiting) {
                    flag.vy += 0.5;
                    flag.y += flag.vy;
                    flag.element.style.top = `${flag.y}px`;

                    if (flag.y > ARENA_SIZE + 50) {
                        flag.element.remove();
                        activeFlags.splice(i, 1);
                    }
                    continue;
                }

                // স্বাভাবিক র‍্যান্ডম মুভমেন্ট স্পিড
                flag.vx += (Math.random() - 0.5) * 0.5;
                flag.vy += (Math.random() - 0.5) * 0.5;

                flag.x += flag.vx;
                flag.y += flag.vy;

                const dx = flag.x + 21 - RADIUS;
                const dy = flag.y + 19 - RADIUS;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist + 19 >= RADIUS - 5) {
                    const nx = dx / dist;
                    const ny = dy / dist;

                    let exitThreshold = activeFlags.length <= 3 ? 15 : 25;

                    if (Math.abs(dx) < exitThreshold && dy > RADIUS - 45 && activeFlags.length > 1) {
                        flag.isExiting = true;
                        flag.vx = 0;
                        flag.vy = 5;
                        flag.element.style.transition = "transform 0.3s ease";
                        flag.element.style.transform = "scale(0.5)";
                        continue;
                    }

                    const dot = flag.vx * nx + flag.vy * ny;
                    flag.vx = (flag.vx - 2 * dot * nx) * 0.90;
                    flag.vy = (flag.vy - 2 * dot * ny) * 0.90;

                    const overlap = (dist + 19) - (RADIUS - 4);
                    flag.x -= nx * overlap;
                    flag.y -= ny * overlap;
                }

                flag.element.style.left = `${flag.x}px`;
                flag.element.style.top = `${flag.y}px`;
            }
        }

        function declareWinner(winner) {
            if (isMatchOver) return;
            isMatchOver = true;
            clearInterval(physicsInterval);

            arenaContainer.classList.remove('rotating');
            arenaContainer.style.transform = "rotate(0deg)";

            countryWins[winner.name]++;
            lastWinnerName = `${winner.name} ${winner.emoji}`;
            updateScoreboardUI();

            activeFlags.forEach(f => {
                if(f !== winner) f.element.remove();
            });
            activeFlags = [winner];

            winner.element.style.transition = "all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            winner.element.style.left = `${RADIUS - 21}px`;
            winner.element.style.top = `${RADIUS - 19}px`;
            winner.element.style.transform = "scale(1.9)";
            winner.element.style.zIndex = "50";

            const overlay = document.createElement('div');
            overlay.className = 'winner-overlay';
            overlay.innerHTML = `
                <div class="w-emoji">${winner.emoji}</div>
                <div class="w-text">ROUND WINNER</div>
                <div class="w-name">${winner.name}</div>
            `;
            arena.appendChild(overlay);

            setTimeout(initGame, 4500);
        }

        initGame();
    </script>
</body>
</html>
