<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flags Battle Royale - Live Sim</title>
    <style>
        body {
            background-color: #050b15;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow: hidden; /* যাতে বের হয়ে যাওয়া পতাকা স্ক্রলবার না আনে */
        }

        /* Top Header Box */
        .top-header {
            background: #0a1930;
            border: 2px solid #1a3a6b;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            margin: 0 auto 15px auto;
            padding: 10px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);
        }
        .header-title {
            color: #00d2ff;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .qualify-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .qualify-table th, .qualify-table td {
            text-align: left;
            padding: 4px 8px;
            border-bottom: 1px solid #1a3a6b;
        }
        .qualify-table tr:last-child td {
            border-bottom: none;
        }
        .text-gold { color: #ffd700; }
        .text-silver { color: #c0c0c0; }
        .text-bronze { color: #cd7f32; }

        /* Main Arena Container */
        .arena-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
        }

        /* Timer */
        #timer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
            background: rgba(5, 11, 21, 0.8);
            padding: 2px 10px;
            border-radius: 5px;
            z-index: 10;
        }

        /* The Circle Arena */
        .arena {
            width: 100%;
            height: 100%;
            border: 6px solid #1a3a6b;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #0a1930 0%, #050b15 70%);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            overflow: visible; /* খুব জরুরি: পতাকাকে বৃত্তের বাইরে যেতে দেওয়ার জন্য */
            z-index: 1;
        }

        /* The Gap (ফাঁক) */
        .gap {
            position: absolute;
            bottom: -15px; /* বৃত্তের বর্ডারের বাইরে */
            left: 50%;
            transform: translateX(-50%);
            width: 50px; /* গেটের সাইজ */
            height: 10px;
            background-color: #050b15; /* ব্যাকগ্রাউন্ডের রঙের সাথে মিলিয়ে দেওয়া */
            z-index: 2;
            /* ঐচ্ছিক: গেটটি একটু গ্লো করার জন্য */
            box-shadow: 0 0 10px #00d2ff; 
            border-radius: 5px;
        }

        /* Flag Elements */
        .flag-item {
            position: absolute;
            width: 30px;
            height: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ফিজিক্সের জন্য ট্রানজিশন সরানো হয়েছে, মুভমেন্ট JS দ্বারা কন্ট্রোল হবে */
        }
    </style>
</head>
<body>

    <!-- Top Header Box (Screenshot মত) -->
    <div class="top-header">
        <div class="header-title">🏁 বর্তমানে কোয়ালিফাইং রাউন্ড চলছে 🏁</div>
        <table class="qualify-table" id="qualifyTable">
            <!-- JavaScript দিয়ে ডাটা এখানে বসবে -->
        </table>
    </div>

    <div class="arena-container">
        <!-- Timer -->
        <div id="timer">55</div>
        
        <!-- The Battle Arena -->
        <div class="arena" id="arena">
            <!-- The Gap at the bottom -->
            <div class="gap"></div>
        </div>
    </div>

    <script>
        // --- ডাটাবেজ (২০০+ দেশ) ---
        const flagsData = [
            { name: "Bangladesh", emoji: "🇧🇩" }, { name: "India", emoji: "🇮🇳" }, { name: "USA", emoji: "🇺🇸" },
            { name: "UK", emoji: "🇬🇧" }, { name: "Japan", emoji: "🇯🇵" }, { name: "Brazil", emoji: "🇧🇷" },
            { name: "Germany", emoji: "🇩🇪" }, { name: "France", emoji: "🇫🇷" }, { name: "Canada", emoji: "🇨🇦" },
            { name: "Australia", emoji: "🇦🇺" }, { name: "Russia", emoji: "🇷🇺" }, { name: "China", emoji: "🇨🇳" },
            { name: "Argentina", emoji: "🇦🇷" }, { name: "South Korea", emoji: "🇰🇷" }, { name: "Saudi Arabia", emoji: "🇸🇦" },
            { name: "Turkey", emoji: "🇹🇷" }, { name: "Nigeria", emoji: "🇳🇬" }, { name: "Egypt", emoji: "🇪🇬" },
            { name: "Mexico", emoji: "🇲🇽" }, { name: "Italy", emoji: "🇮🇹" }, { name: "Spain", emoji: "🇪🇸" },
            { name: "Pakistan", emoji: "🇵🇰" }, { name: "Indonesia", emoji: "🇮🇩" }, { name: "South Africa", emoji: "🇿🇦" },
            { name: "Netherlands", emoji: "🇳🇱🇷" }, { name: "Sweden", emoji: "🇸🇪" }, { name: "Switzerland", emoji: "🇨🇭" },
            { name: "Singapore", emoji: "🇸🇬" }, { name: "UAE", emoji: "🇦🇪" }, { name: "Qatar", emoji: "🇶🇦" },
            { name: "Malaysia", emoji: "🇲🇾" }, { name: "Thailand", emoji: "🇹🇭" }, { name: "Vietnam", emoji: "🇻🇳" },
            { name: "Philippines", emoji: "🇵🇭" }, { name: "Ukraine", emoji: "🇺🇦" }, { name: "Poland", emoji: "🇵🇱" },
            { name: "Norway", emoji: "🇳🇴" }, { name: "Denmark", emoji: "🇩🇰" }, { name: "Finland", emoji: "🇫🇮" },
            { name: "Greece", emoji: "🇬🇷" }, { name: "Czech Republic", emoji: "🇨🇿" }, { name: "Hungary", emoji: "🇭🇺" },
            { name: "Portugal", emoji: "🇵🇹" }, { name: "Ireland", emoji: "🇮🇪" }, { name: "New Zealand", emoji: "🇳🇿" },
            { name: "Israel", emoji: "🇮🇱" }, { name: "Iran", emoji: "🇮🇷" }, { name: "Iraq", emoji: "🇮🇶" },
            { name: "Colombia", emoji: "🇨🇴" }, { name: "Peru", emoji: "🇵🇪" }, { name: "Chile", emoji: "🇨🇱" },
            { name: "Morocco", emoji: "🇲🇦" }, { name: "Kenya", emoji: "🇰🇪" }, { name: "Ghana", emoji: "🇬🇭" },
            { name: "Ethiopia", emoji: "🇪🇹" }, { name: "Algeria", emoji: "🇩🇿" }, { name: "Vietnam", emoji: "🇻🇳" },
            { name: "Kazakhstan", emoji: "🇰🇿" }, { name: "Uzbekistan", emoji: "🇺🇿" }, { name: "Austria", emoji: "🇦🇹" },
            { name: "Belgium", emoji: "🇧🇪" }, { name: "Romania", emoji: "🇷🇴" }, { name: "Greece", emoji: "🇬🇷" }
        ];

        // --- গেমের ভেরিয়েবল ---
        const arena = document.getElementById('arena');
        const timerEl = document.getElementById('timer');
        const qualifyTable = document.getElementById('qualifyTable');
        
        const ARENA_SIZE = 500;
        const RADIUS = ARENA_SIZE / 2;
        const GAP_WIDTH = 50px; // CSS এর সাথে মিল রেখে
        const FLAG_SIZE = 30;

        let activeFlags = [];
        let qualificationList = []; // Top 5
        let timeLeft = 55;
        let gameInterval;
        let physicsInterval;

        // --- ১. ইনিশিয়ালাইজেশন ---
        function initGame() {
            arena.innerHTML = '<div class="gap"></div>'; // গ্যাপটা ঠিক রাখা
            activeFlags = [];
            timeLeft = 55;
            timerEl.innerText = timeLeft;
            timerEl.style.color = "#ff4757";

            // সব পতাকা রেন্ডম পজিশনে বসানো
            const shuffled = [...flagsData].sort(() => 0.5 - Math.random());
            const selectedFlags = shuffled.slice(0, 40); // একসাথে ৪০টা পতাকা, খুব বেশি হলে জ্যাম লেগে যাবে

            selectedFlags.forEach((data) => {
                const el = document.createElement('div');
                el.className = 'flag-item';
                el.innerText = data.emoji;
                
                // বৃত্তের ভেতরে রেন্ডম পজিশন (কেন্দ্র থেকে একটু দূরে)
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (RADIUS * 0.7);
                const x = RADIUS - (FLAG_SIZE/2) + (dist * Math.cos(angle));
                const y = RADIUS - (FLAG_SIZE/2) + (dist * Math.sin(angle));

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                arena.appendChild(el);

                activeFlags.push({
                    element: el,
                    name: data.name,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8, // ভেলোসিটি (গতি)
                    vy: (Math.random() - 0.5) * 8,
                    isExiting: false
                });
            });

            updateQualifyTable();
            
            // টাইমার ও ফিজিক্স লুপ চালু
            clearInterval(gameInterval);
            clearInterval(physicsInterval);
            gameInterval = setInterval(runTimer, 1000);
            physicsInterval = setInterval(updatePhysics, 1000 / 60); // ~60 FPS
        }

        // --- ২. টাইমার লজিক ---
        function runTimer() {
            timeLeft--;
            timerEl.innerText = timeLeft;

            if (timeLeft <= 10) {
                timerEl.style.color = "#ffeb3b"; // শেষ ১০ সেকেন্ডে কালার হলুদ
            }

            if (timeLeft <= 0) {
                endMatch();
            }
        }

        // --- ৩. ফিজিক্স এবং মুভমেন্ট (সবচেয়ে গুরুত্বপূর্ণ অংশ) ---
        function updatePhysics() {
            const damping = 0.99; // ফ্রিকশন বা ঘর্ষণ (ধীরে ধীরে গতি কমবে)
            const collisionRestitution = 0.8; // বাউন্স ফ্যাক্টর

            activeFlags.forEach((flag, index) => {
                if (flag.isExiting) {
                    // যদি পতাকা বের হওয়ার মোশনে থাকে, তবে সোজা নিচের দিকে পড়তে থাকবে
                    flag.vy += 0.5; // গ্রাভিটি বা অভিকর্ষজ টান
                    flag.y += flag.vy;
                    flag.element.style.top = `${flag.y}px`;

                    // স্ক্রিন থেকে পুরোপুরি বেরিয়ে গেলে সরিয়ে ফেলা
                    if (flag.y > ARENA_SIZE + 50) {
                        flag.element.remove();
                        activeFlags.splice(index, 1);
                    }
                    return; // অন্য ফিজিক্স এপ্লাই হবে না
                }

                // সাধারণ গতি
                flag.x += flag.vx;
                flag.y += flag.vy;

                // দেয়াল বা বাউন্ডারি ডিটেকশন (বৃত্তের ভেতরে)
                const dx = flag.x + (FLAG_SIZE/2) - RADIUS;
                const dy = flag.y + (FLAG_SIZE/2) - RADIUS;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // যদি পতাকা বৃত্তের পরিধিতে আঘাত করে
                if (dist + (FLAG_SIZE/2) >= RADIUS) {
                    // নরমাল ভেক্টর বের করা
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // প্রতিফলিত ভেক্টর (Reflection)
                    const dot = flag.vx * nx + flag.vy * ny;
                    flag.vx = (flag.vx - 2 * dot * nx) * collisionRestitution;
                    flag.vy = (flag.vy - 2 * dot * ny) * collisionRestitution;

                    // পতাকাকে একটু ভেতরে ঠেলে দেওয়া যাতে আটকে না যায়
                    const overlap = (dist + FLAG_SIZE/2) - RADIUS;
                    flag.x -= nx * overlap;
                    flag.y -= ny * overlap;

                    // --- গ্যাপ চেক (The Logic for the Hole) ---
                    // গ্যাপের পজিশন: নিচে (bottom), X কোঅর্ডিনেট মিডিলে
                    const angleToCenter = Math.atan2(dy, dx);
                    // গ্যাপের অ্যাঙ্গেল রেঞ্জ (নিচের দিকে, আনুমানিক -৯০ ডিগ্রি +/- ১৫ ডিগ্রি)
                    if (angleToCenter > (Math.PI / 2 - 0.5) && angleToCenter < (Math.PI / 2 + 0.5)) {
                        // এক্স পজিশন কি গ্যাপের মধ্যে? গ্যাপের সেন্টার RADIUS, তাই রেঞ্জ RADIUS +/- 25
                        if (Math.abs(dx) < GAP_WIDTH / 2) {
                            // কপাল ভালো! পতাকা গ্যাপের অ্যাঙ্গেলে আছে এবং এক্স পজিশনও ঠিক আছে।
                            flag.isExiting = true;
                            flag.vy = Math.abs(flag.vy) + 2; // জোর করে নিচের দিকে গতি দেওয়া
                            flag.vx = (Math.random() - 0.5) * 2; // সামান্য এদিক-ওদিক বাঁকানো
                            
                            // কোয়ালিফাইড লিস্টে যোগ করা (যেহেতু সে বের হয়ে যাচ্ছে)
                            if(qualificationList.length < 5) {
                                qualifyFlag(flag);
                            }
                        }
                    }
                }

                // গতি কমানো (ফ্রিকশন)
                flag.vx *= damping;
                flag.vy *= damping;

                // DOM আপডেট
                flag.element.style.left = `${flag.x}px`;
                flag.element.style.top = `${flag.y}px`;
            });
        }

        // --- ৪. কোয়ালিফিকেশন লজিক ---
        function qualifyFlag(flagData) {
            // চেক করা যে অলরেডি লিস্টে আছে কিনা
            if(!qualificationList.some(f => f.name === flagData.name)) {
                qualificationList.push({
                    name: flagData.name,
                    emoji: flagData.element.innerText
                });
                updateQualifyTable();
            }
        }

        function updateQualifyTable() {
            qualifyTable.innerHTML = ''; // ক্লিয়ার করা

            // টেবিল হেডার
            qualifyTable.innerHTML = `
                <tr>
                    <th>#</th>
                    <th>দেশ</th>
                    <th>স্ট্যাটাস</th>
                </tr>
            `;

            const medals = ["text-gold", "text-silver", "text-bronze"];
