<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flags Battle Royale - Final</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050b15;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 10px;
        }

        /* Top Header Box (Winner Box) */
        .top-header {
            background: #0a1930;
            border: 2px solid #1a3a6b;
            border-radius: 8px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 15px;
            padding: 8px;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
        }
        .header-title {
            color: #00d2ff;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .qualify-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #112240;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            border-left: 3px solid #ffd700;
        }
        .qualify-row span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Main Arena Container */
        .arena-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-top: 10px;
            animation: rotateArena 20s linear infinite;
        }

        @keyframes rotateArena {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* The Circle Arena */
        .arena {
            width: 100%;
            height: 100%;
            border: 5px solid #1a3a6b;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #0a1930 0%, #050b15 80%);
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.2);
            overflow: visible;
        }

        /* The Gap (গেটের ফাঁক) */
        .gap {
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 8px;
            background-color: #050b15;
            z-index: 5;
            border-bottom: 3px solid #ff4757;
            border-radius: 4px;
        }

        /* Flag Container with Name */
        .flag-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 35px;
            will-change: left, top;
        }
        .flag-emoji {
            font-size: 20px;
        }
        .flag-name {
            font-size: 8px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 1px 3px;
            border-radius: 3px;
            white-space: nowrap;
            margin-top: 1px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Top Header Box -->
    <div class="top-header">
        <div class="header-title" id="headerTitle">🏁 FINAL BATTLE (LAST 1 WIN) 🏁</div>
        <div id="winnerBox">
            <div class="qualify-row">
                <span>#1 ---</span> <span style="color:#555;">Battling...</span>
            </div>
        </div>
    </div>

    <!-- Arena Container -->
    <div class="arena-container">
        <div class="arena" id="arena">
            <div class="gap"></div>
        </div>
    </div>

    <script>
        const flagsData = [
            { name: "Bangladesh", emoji: "🇧🇩" }, { name: "India", emoji: "🇮🇳" }, { name: "USA", emoji: "🇺🇸" },
            { name: "UK", emoji: "🇬🇧" }, { name: "Japan", emoji: "🇯🇵" }, { name: "Brazil", emoji: "🇧🇷" },
            { name: "Germany", emoji: "🇩🇪" }, { name: "France", emoji: "🇫🇷" }, { name: "Canada", emoji: "🇨🇦" },
            { name: "Australia", emoji: "🇦🇺" }, { name: "Russia", emoji: "🇷🇺" }, { name: "China", emoji: "🇨🇳" },
            { name: "Argentina", emoji: "🇦🇷" }, { name: "South Korea", emoji: "🇰🇷" }, { name: "Spain", emoji: "🇪🇸" },
            { name: "Italy", emoji: "🇮🇹" }, { name: "Saudi Arabia", emoji: "🇸🇦" }, { name: "Turkey", emoji: "🇹🇷" },
            { name: "Mexico", emoji: "🇲🇽" }, { name: "Indonesia", emoji: "🇮🇩" }, { name: "Pakistan", emoji: "🇵🇰" }
        ];

        const arena = document.getElementById('arena');
        const winnerBox = document.getElementById('winnerBox');
        const headerTitle = document.getElementById('headerTitle');

        const ARENA_SIZE = 320;
        const RADIUS = ARENA_SIZE / 2;

        let activeFlags = [];
        let physicsInterval;
        let isMatchOver = false;

        function initGame() {
            arena.innerHTML = '<div class="gap"></div>';
            activeFlags = [];
            isMatchOver = false;
            headerTitle.innerText = "🏁 FINAL BATTLE (LAST 1 WIN) 🏁";
            winnerBox.innerHTML = `<div class="qualify-row"><span>#1 ---</span> <span style="color:#555;">Battling...</span></div>`;

            const shuffled = [...flagsData].sort(() => 0.5 - Math.random());
            const selectedFlags = shuffled.slice(0, 20); // ২০টি পতাকা দিয়ে খেলা শুরু

            selectedFlags.forEach((data) => {
                const el = document.createElement('div');
                el.className = 'flag-item';
                el.innerHTML = `<span class="flag-emoji">${data.emoji}</span><span class="flag-name">${data.name}</span>`;
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (RADIUS - 50);
                const x = RADIUS - 20 + (dist * Math.cos(angle));
                const y = RADIUS - 17 + (dist * Math.sin(angle));

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;

                arena.appendChild(el);

                activeFlags.push({
                    element: el,
                    name: data.name,
                    emoji: data.emoji,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    isExiting: false
                });
            });

            clearInterval(physicsInterval);
            physicsInterval = setInterval(updatePhysics, 1000 / 60);
        }

        function updatePhysics() {
            if (isMatchOver) return;

            // যদি মাত্র ১টি পতাকা বেঁচে থাকে, সে উইনার!
            if (activeFlags.length === 1 && !activeFlags[0].isExiting) {
                let winner = activeFlags[0];
                isMatchOver = true;
                headerTitle.innerText = "🏆 WINNER 🏆";
                winnerBox.innerHTML = `
                    <div class="qualify-row" style="border-left-color: #00d2ff;">
                        <span>#1 ${winner.emoji} ${winner.name}</span> <span style="color:#00d2ff; font-weight:bold;">WINNER!</span>
                    </div>
                `;
                setTimeout(initGame, 4000); // ৪ সেকেন্ড পর নতুন ম্যাচ শুরু হবে
                return;
            }

            for (let i = activeFlags.length - 1; i >= 0; i--) {
                let flag = activeFlags[i];

                if (flag.isExiting) {
                    flag.vy += 0.5;
                    flag.y += flag.vy;
                    flag.element.style.top = `${flag.y}px`;

                    if (flag.y > ARENA_SIZE + 40) {
                        flag.element.remove();
                        activeFlags.splice(i, 1);
                    }
                    continue;
                }

                // এদিক-সেদিক ছোটাছুটি করার জন্য সামান্য রেন্ডম ফোর্স
                flag.vx += (Math.random() - 0.5) * 0.6;
                flag.vy += (Math.random() - 0.5) * 0.6;

                flag.x += flag.vx;
                flag.y += flag.vy;

                const dx = flag.x + 20 - RADIUS;
                const dy = flag.y + 17 - RADIUS;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist + 18 >= RADIUS - 4) {
                    const nx = dx / dist;
                    const ny = dy / dist;

                    // গ্যাপ দিয়ে পতাকা বাইরে বের হয়ে যাওয়ার শর্ত (শেষের দিকে পতাকা কমালে এটি কাজ করবে)
                    if (Math.abs(dx) < 22 && dy > RADIUS - 40 && activeFlags.length > 1) {
                        flag.isExiting = true;
                        flag.vx = 0;
                        flag.vy = 5;
                        continue;
                    }

                    const dot = flag.vx * nx + flag.vy * ny;
                    flag.vx = (flag.vx - 2 * dot * nx) * 0.85;
                    flag.vy = (flag.vy - 2 * dot * ny) * 0.85;

                    const overlap = (dist + 18) - (RADIUS - 4);
                    flag.x -= nx * overlap;
                    flag.y -= ny * overlap;
                }

                flag.element.style.left = `${flag.x}px`;
                flag.element.style.top = `${flag.y}px`;
            }
        }

        initGame();
    </script>
</body>
</html>
